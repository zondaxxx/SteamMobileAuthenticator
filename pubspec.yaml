name: steam_mobile_authenticator
description: "A privacy-first, cross-platform Steam Guard authenticator."
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: ^3.13.1

dependencies:
  crypto: ^3.0.7
  cryptography: ^2.9.0
  cupertino_icons: ^1.0.8
  file_picker: ^12.0.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: 10.0.0
  http: ^1.6.0
  intl: ^0.20.3
  local_auth: ^3.0.2
  mobile_scanner: ^7.4.0
  pointycastle: ^4.0.0
  shared_preferences: ^2.5.5
  workmanager: 0.9.1+1

dependency_overrides:
  # Keep the federated implementations on one compatible API generation.
  # Newer Apple releases also use Xcode 26-only background task APIs.
  workmanager_android: 0.9.0+2
  workmanager_apple: 0.9.3+1
  workmanager_platform_interface: 0.9.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
